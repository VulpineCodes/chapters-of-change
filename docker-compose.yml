services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: chapters, POSTGRES_PASSWORD: chapters, POSTGRES_DB: chapters }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U chapters"], interval: 5s, timeout: 3s, retries: 10 }
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 10 }
  api:
    build: { context: ., dockerfile: apps/api/Dockerfile }
    environment: { DATABASE_URL: postgresql://chapters:chapters@postgres:5432/chapters?schema=public, REDIS_URL: redis://redis:6379, PORT: "4000" }
    ports: ["4000:4000"]
    depends_on: { postgres: { condition: service_healthy }, redis: { condition: service_healthy } }
  web:
    build: { context: ., dockerfile: apps/web/Dockerfile }
    environment: { NEXT_PUBLIC_API_URL: http://localhost:4000 }
    ports: ["3000:3000"]
    depends_on: [api]
volumes: { pgdata: {} }
